name: Daily Consultations Digest

on:
  schedule:
    # 12:00 UTC = 8:00 AM EDT (summer) / 7:00 AM EST (winter)
    - cron: '0 12 * * *'
  workflow_dispatch:   # lets you trigger a run manually from the GitHub website
  push:
    branches: [main]
    paths-ignore:
      - 'docs/index.html'       # don't re-trigger when the workflow commits the digest
      - 'previous_items.json'   # don't re-trigger when the workflow saves item history

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit docs/index.html back to the repo

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        run: python generate_digest.py

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python notify_slack.py

      - name: Copy digest to docs/index.html
        run: |
          mkdir -p docs
          cp digest_$(date +%Y-%m-%d).html docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html previous_items.json
          git commit -m "Digest: $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
